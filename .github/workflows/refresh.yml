# schedule re-registered 2026-11-14
name: Refresh playlist
concurrency:
  group: refresh-playlist
  cancel-in-progress: false
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.m3u
          git diff --cached --quiet || git commit -m "refresh live.m3u"
          if ! git push; then
            echo "push raced, retrying on latest main"
            git fetch origin
            git reset --hard origin/main
            node fetch.mjs
            git add live.m3u
            git diff --cached --quiet || git commit -m "refresh live.m3u"
            git push
          fi
